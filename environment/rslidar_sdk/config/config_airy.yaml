common:
  msg_source: 1
  send_packet_ros: false
  send_point_cloud_ros: true

lidar:
  - driver:
      lidar_type: RSAIRY
      msop_port: 6699
      difop_port: 7788
      imu_port: 6688
      host_address: 0.0.0.0
      group_address: 0.0.0.0
      user_layer_bytes: 0
      tail_layer_bytes: 0
      min_distance: 0.2
      max_distance: 60.0
      # This Airy currently reports a device-uptime clock rather than Unix/UTC.
      # Use host receive time so ROS, MAVROS and PX4 share one epoch.  Set true
      # only after the lidar itself has been verified PTP/GPS-synchronised.
      use_lidar_clock: false
      dense_points: true
      ts_first_point: true
      wait_for_difop: true
      start_angle: 0
      end_angle: 360
    ros:
      ros_frame_id: rslidar
      ros_send_point_cloud_topic: /rslidar_points
      ros_send_imu_data_topic: /rslidar_imu_data
      ros_recv_packet_topic: /rslidar_packets
      ros_send_packet_topic: /rslidar_packets
      # Keep only a very small outgoing history. FAST-LIO has its own bounded
      # latest-frame policy; a large ROS publisher queue recreates old-data lag.
      ros_queue_length: 1
      ros_send_by_rows: false
